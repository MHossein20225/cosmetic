services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmetic
      POSTGRES_PASSWORD: cosmetic_dev_password
      POSTGRES_DB: cosmetic_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cosmetic_pgdata:/var/lib/postgresql/data
    networks:
      - backend
      - db-host-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmetic -d cosmetic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://cosmetic:cosmetic_dev_password@db:5432/cosmetic_db?schema=public"
      TRUST_PROXY: "true"
      RATE_LIMIT_IP_HEADER: "x-forwarded-for"
    networks:
      - backend
      - edge
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    depends_on:
      - web

networks:
  backend:
    internal: true
  edge:
  db-host-access:
    driver: bridge

volumes:
  cosmetic_pgdata:
